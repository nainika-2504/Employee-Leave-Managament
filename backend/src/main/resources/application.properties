server.port=8085

# Database Configuration (TiDB Cloud Serverless - Free Cloud MySQL)
# Set these via environment variables or create application-local.properties (git-ignored)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://gateway01.eu-central-1.prod.aws.tidbcloud.com:4000/elms_db?createDatabaseIfNotExist=true&useSSL=true&requireSSL=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:YOUR_TIDB_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:YOUR_TIDB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# HikariCP Connection Pooling
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# Disable auto-running data.sql (DataSeeder handles all seeding automatically)
spring.sql.init.mode=never
